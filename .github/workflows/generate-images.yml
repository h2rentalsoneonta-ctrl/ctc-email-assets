name: Generate requested images

on:
  push:
    branches: [main]
    paths: ["requests/*.json"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: generate-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Generate with Cloudflare Workers AI (free tier)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python scripts/generate.py
      - name: Commit images
        run: |
          git config user.name "ctc-image-bot"
          git config user.email "noreply@condotravelclub.com"
          git add -A img requests manifest.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Generate requested email images"
          git push
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; the next push will publish"
